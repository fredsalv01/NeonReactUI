<!DOCTYPE html>
<html>
  <head>
    <script>
      const path = window.location.pathname.replace('/NeonReactUI', '') || '/';
      const search = window.location.search;
      const hash = window.location.hash;

      sessionStorage.setItem('redirect', path + search + hash);
      window.location.href = '/NeonReactUI/';
    </script>
  </head>
  <body></body>
</html>
